<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register | Makeup Live</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>

<body>
  <header class="navbar">
    <a class="brand" href="../index.html">Makeup <strong>Live</strong></a>

    <nav class="nav-links">
      <a href="./tutorials.html">Tutorials</a>
      <a href="./products.html">Products</a>
      <a href="./skin-agent.html">Skin Quiz</a>
      <a href="./live.html">Live</a>
      <a href="./favorites.html">Favorites</a>
      <a href="./profile.html">Profile</a>
      <a href="./login.html" class="nav-login">Login</a>
      <a href="./register.html" class="nav-register">Create account</a>
    </nav>
  </header>

  <main class="page auth-page">
    <section class="auth-card">
      <h1>Create account</h1>
      <div class="skin-reminder compact">
  <strong>Before creating your account</strong>
  <span>Take the Skin Quiz and we will preselect your skin type.</span>
  <a href="./skin-agent.html">Take quiz</a>
</div>

      <form class="auth-form" id="registerForm">
        <input name="name" type="text" placeholder="Name" required />
        <input name="email" type="email" placeholder="Email" required />
        <input name="password" type="password" placeholder="Password" required />

        <select name="skin_type">
          <option value="normal">Normal skin</option>
          <option value="dry">Dry skin</option>
          <option value="oily">Oily skin</option>
          <option value="mixed">Mixed skin</option>
        </select>

        <button class="btn primary" type="submit">Register</button>

        <p class="auth-helper">
          Already have an account?
          <a href="./login.html">Login here</a>
        </p>

        <p class="form-message" id="message"></p>
      </form>
    </section>
  </main>

  <script src="../assets/js/api/apiClient.js"></script>
  <script src="../assets/js/pages/register.js"></script>
</body>
</html>
