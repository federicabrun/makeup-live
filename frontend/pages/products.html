<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Products | Makeup Live</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>

<body>
  <header class="navbar">
    <a class="brand" href="../index.html">Makeup <strong>Live</strong></a>

    <nav class="nav-links">
      <a href="./tutorials.html">Tutorials</a>
      <a href="./products.html">Products</a>
      <a href="./live.html">Live</a>
      <a href="./favorites.html">Favorites</a>
      <a href="./profile.html">Profile</a>
      <a href="./login.html" class="nav-login">Login</a>
      <a href="./register.html" class="nav-register">Create account</a>
    </nav>
  </header>

  <main class="page">
    <h1>Products</h1>

    <div class="filters">
      <input id="brandFilter" placeholder="Brand" />

      <select id="skinFilter">
        <option value="">All skin types</option>
        <option value="dry">Dry</option>
        <option value="oily">Oily</option>
        <option value="mixed">Mixed</option>
        <option value="normal">Normal</option>
      </select>

      <button class="btn secondary" id="applyFilters">Apply</button>
    </div>

    <section class="grid" id="productGrid"></section>

   <section class="external-section">
  <h2>External Discovery</h2>

  <div class="filters">
    <select id="externalBrand">
      <option value="maybelline">Maybelline</option>
      <option value="dior">Dior</option>
      <option value="covergirl">Covergirl</option>
      <option value="nyx">NYX</option>
      <option value="revlon">Revlon</option>
      <option value="clinique">Clinique</option>
      <option value="benefit">Benefit</option>
      <option value="smashbox">Smashbox</option>
      <option value="l'oreal">L'Oréal</option>
    </select>

    <select id="externalType">
      <option value="">All product types</option>
      <option value="lipstick">Lipstick</option>
      <option value="mascara">Mascara</option>
      <option value="foundation">Foundation</option>
      <option value="eyeshadow">Eyeshadow</option>
      <option value="blush">Blush</option>
    </select>

  <button class="btn primary" id="loadExternalProducts">
  Search
</button>
  </div>

  <section class="grid" id="externalProductsGrid"></section>
</section>
  </main>

  <script src="../assets/js/api/apiClient.js"></script>
  <script src="../assets/js/classes/Product.js"></script>
  <script src="../assets/js/pages/products.js"></script>
</body>
</html>
